name: Linux setup
description: The system libraries RimStack builds and is packaged with
runs:
  using: composite
  steps:
    - name: System libraries
      shell: bash
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends \
          libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libfontconfig-dev file lld
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' }}
