# RimStack as a Flatpak: built from the source in this repository against the Qt
# in the KDE runtime, so it runs on any distribution with Flatpak, on the
# runtime's own libraries.
#
#   flatpak-builder --user --install --force-clean build-dir \
#       packaging/flatpak/io.github.TheForgotten69.RimStack.yaml
#
# `just flatpak` builds the .flatpak file a release gets.
#
# generated-sources.json holds every crate in Cargo.lock, so the build needs no
# network. It is not kept: packaging/flatpak/generated-sources.sh writes it from
# Cargo.lock, and this file's build reads it from there.
app-id: io.github.TheForgotten69.RimStack
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rimstack

# SteamCMD has no 64-bit build, so it needs the runtime's 32-bit libraries,
# where the runtime's /lib/ld-linux.so.2 points.
add-extensions:
  org.freedesktop.Platform.Compat.i386:
    directory: lib/i386-linux-gnu
    version: '25.08'

finish-args:
  # A window of its own on the desktop's compositor, drawn by the GPU.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Both the 32-bit libraries and the app's own sit under /app/lib.
  - --allow=multiarch
  # Community rules, Steam's pages and mod textures are fetched, on request only.
  - --share=network
  # The game, its Mods folder, Steam's workshop library, its settings and the
  # saves are all somewhere in the user's home, game, mods can be on separate drive too
  - --filesystem=home
  # A Steam from Flathub keeps its library, workshop items and settings in its own sandbox.
  - --filesystem=~/.var/app/com.valvesoftware.Steam
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt

modules:
  - name: rimstack
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/rimstack/cargo
    build-commands:
      # Flatpak mounts the extension over this folder; the app makes it.
      - mkdir -p /app/lib/i386-linux-gnu
      - cargo --offline fetch --manifest-path Cargo.toml
      - cargo --offline build --profile dist -p rimstack-app
      - install -Dm755 target/dist/rimstack /app/bin/rimstack
      - install -Dm644 crates/app/assets/rimstack.svg /app/share/icons/hicolor/scalable/apps/$FLATPAK_ID.svg
      - install -Dm644 crates/app/assets/rimstack.desktop /app/share/applications/$FLATPAK_ID.desktop
      # Flatpak shows the icon and the name it files the application under.
      - desktop-file-edit --set-key=Icon --set-value=$FLATPAK_ID /app/share/applications/$FLATPAK_ID.desktop
      - desktop-file-edit --set-key=StartupWMClass --set-value=$FLATPAK_ID /app/share/applications/$FLATPAK_ID.desktop
      # The release is the version Cargo.toml names, so the two cannot disagree.
      - packaging/flatpak/metainfo-version.py packaging/flatpak/$FLATPAK_ID.metainfo.xml $FLATPAK_ID.metainfo.xml
      - install -Dm644 $FLATPAK_ID.metainfo.xml /app/share/metainfo/$FLATPAK_ID.metainfo.xml
    sources:
      - generated-sources.json
      # This repository. `target` is the build's own; the .git folder gives the
      # program the commit it was built from.
      - type: dir
        path: ../../
        skip:
          - target

  # The runtime has no git, and a program may not run the host's: RimStack runs
  # git to read a mod's own checkout, and refuses the ones that are more than a
  # clone. Placed after the app, which does not need it while building.
  - name: git
    buildsystem: simple
    build-commands:
      - make -j "$FLATPAK_BUILDER_N_JOBS" prefix=/app NO_TCLTK=1 NO_GETTEXT=1
        NO_PERL=1 NO_PYTHON=1 NO_RUST=1 NO_INSTALL_HARDLINKS=1 USE_LIBPCRE2=1
      - make prefix=/app NO_TCLTK=1 NO_GETTEXT=1 NO_PERL=1 NO_PYTHON=1
        NO_RUST=1 NO_INSTALL_HARDLINKS=1 USE_LIBPCRE2=1 install
    cleanup:
      - /share/doc
      - /share/man
      - /share/locale
    sources:
      - type: archive
        url: https://www.kernel.org/pub/software/scm/git/git-2.56.0.tar.xz
        sha256: 26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3
        x-checker-data:
          type: anitya
          project-id: 5350
          url-template: https://www.kernel.org/pub/software/scm/git/git-$version.tar.xz
